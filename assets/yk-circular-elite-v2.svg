<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Yaswanth Kalendra Circular Elite emblem</title>
  <desc id="desc">A metallic YK monogram inside a luminous cyan circular cyber-security badge and shield.</desc>
  <defs>
    <linearGradient id="steel" x1="170" y1="130" x2="860" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9fcff"/>
      <stop offset=".18" stop-color="#8eadd0"/>
      <stop offset=".47" stop-color="#ffffff"/>
      <stop offset=".72" stop-color="#6c8fb4"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="260" y1="285" x2="760" y2="805" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#cbd9e8"/>
      <stop offset=".52" stop-color="#8da6bf"/>
      <stop offset=".76" stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#7895b1"/>
    </linearGradient>
    <linearGradient id="cyan" x1="180" y1="160" x2="842" y2="866" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8affff"/>
      <stop offset=".28" stop-color="#20dcff"/>
      <stop offset=".7" stop-color="#147bff"/>
      <stop offset="1" stop-color="#72ffe9"/>
    </linearGradient>
    <linearGradient id="cyanPlate" x1="555" y1="300" x2="815" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9bffff"/>
      <stop offset=".34" stop-color="#2bdcff"/>
      <stop offset=".76" stop-color="#1678ff"/>
      <stop offset="1" stop-color="#60ffe9"/>
    </linearGradient>
    <radialGradient id="disc" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 490) rotate(90) scale(420)">
      <stop offset="0" stop-color="#10446f"/>
      <stop offset=".42" stop-color="#071e39"/>
      <stop offset="1" stop-color="#020812"/>
    </radialGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 510) rotate(90) scale(455)">
      <stop offset=".68" stop-color="#16dfff" stop-opacity="0"/>
      <stop offset=".82" stop-color="#16dfff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#16dfff" stop-opacity=".5"/>
    </radialGradient>
    <pattern id="hex" width="28" height="24.248" patternUnits="userSpaceOnUse">
      <path d="M7 1h14l7 11.124-7 11.124H7L0 12.124 7 1Z" fill="none" stroke="#4acfff" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.85 0 0 0 0 1 0 0 0 .8 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000510" flood-opacity=".7"/>
    </filter>
    <clipPath id="discClip"><circle cx="512" cy="512" r="345"/></clipPath>
