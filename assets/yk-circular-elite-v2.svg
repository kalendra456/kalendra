    <path d="M230 322H334L497 487" fill="none" stroke="#fff" stroke-opacity=".58" stroke-width="5" stroke-linecap="round"/>
    <path d="M700 323H790L641 486" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
    <path d="M647 565L699 521L883 720" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
