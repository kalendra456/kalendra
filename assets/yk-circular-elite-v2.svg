  <circle cx="512" cy="512" r="376" fill="none" stroke="url(#cyan)" stroke-width="13" filter="url(#cyanGlow)"/>
  <circle cx="512" cy="512" r="354" fill="url(#disc)" stroke="#2ac7ff" stroke-opacity=".7" stroke-width="3"/>
  <circle cx="512" cy="512" r="345" fill="url(#hex)" opacity=".75" clip-path="url(#discClip)"/>

