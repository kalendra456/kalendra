name: Tune balanced typography scale

on:
  push:
    branches: ["balanced-typography-scale"]
    paths:
      - ".typography-update/TUNE"

permissions:
  contents: write

jobs:
  tune-typography:
    runs-on: ubuntu-latest

    steps:
      - name: Check out typography branch
        uses: actions/checkout@v4
        with:
          ref: balanced-typography-scale
          fetch-depth: 0

      - name: Apply final restrained type scale
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('typography.css')
          css = path.read_text(encoding='utf-8')

          replacements = {
              '--type-display: clamp(2.45rem, 4.15vw, 3.75rem);': '--type-display: clamp(2.35rem, 3.75vw, 3.5rem);',
              '--type-page-title: clamp(2.25rem, 3.75vw, 3.45rem);': '--type-page-title: clamp(2.15rem, 3.3vw, 3.25rem);',
              '--type-section: clamp(1.65rem, 2.45vw, 2.5rem);': '--type-section: clamp(1.6rem, 2.15vw, 2.35rem);',
              '--type-section-emphasis: clamp(1.75rem, 2.65vw, 2.65rem);': '--type-section-emphasis: clamp(1.7rem, 2.3vw, 2.5rem);',
              '--type-feature-title: clamp(1.55rem, 2.2vw, 2.15rem);': '--type-feature-title: clamp(1.5rem, 2vw, 2rem);',
              '--type-card-title: clamp(1.12rem, 1.3vw, 1.28rem);': '--type-card-title: clamp(1.08rem, 1.2vw, 1.22rem);',
              '--type-display: clamp(2.15rem, 8vw, 2.45rem);': '--type-display: clamp(2.1rem, 7.4vw, 2.35rem);',
              '--type-page-title: clamp(2rem, 7.5vw, 2.25rem);': '--type-page-title: clamp(1.95rem, 7vw, 2.15rem);',
              '--type-section: clamp(1.5rem, 6vw, 1.65rem);': '--type-section: clamp(1.45rem, 5.8vw, 1.6rem);',
              '--type-section-emphasis: clamp(1.55rem, 6.3vw, 1.75rem);': '--type-section-emphasis: clamp(1.5rem, 6vw, 1.7rem);',
              '--type-feature-title: clamp(1.4rem, 5.8vw, 1.55rem);': '--type-feature-title: clamp(1.35rem, 5.4vw, 1.5rem);',
              '--type-card-title: clamp(1.05rem, 4.6vw, 1.18rem);': '--type-card-title: clamp(1.02rem, 4.4vw, 1.08rem);',
          }

          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'Missing expected typography value: {old}')
              css = css.replace(old, new, 1)

          if '6.8rem' in css or '4.2rem' in css:
              raise SystemExit('Legacy oversized type ceilings detected in typography layer')

          path.write_text(css, encoding='utf-8')
          PY

          git diff --check
          rm -rf .typography-update
          rm -f .github/workflows/tune-typography-scale.yml

      - name: Commit final typography tuning
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tune portfolio type scale for readability"
          git push origin HEAD:balanced-typography-scale
