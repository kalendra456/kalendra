name: Fix large footer logo balance

on:
  push:
    branches:
      - main
    paths:
      - .footer-logo-fix-v8/READY

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply footer-logo sizing and circular crop
        run: python3 .github/scripts/fix-large-footer-logo-v8.py

      - name: Remove temporary migration files
        run: |
          rm -rf .footer-logo-fix-v8
          rm -f .github/scripts/fix-large-footer-logo-v8.py
          rm -f .github/workflows/fix-large-footer-logo-v8.yml

      - name: Commit corrected footer lockup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Balance and crop large footer YK logo"
          git push origin HEAD:main
