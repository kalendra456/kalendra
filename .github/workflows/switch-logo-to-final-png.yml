name: Switch portfolio to final PNG logo

on:
  push:
    branches:
      - main
    paths:
      - .logo-fix/READY

permissions:
  contents: write

jobs:
  switch-logo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace broken SVG references with proven PNG
        run: python3 .github/scripts/switch-logo-to-final-png.py

      - name: Remove temporary and invalid files
        run: |
          rm -rf .logo-fix
          rm -f assets/yk-selected-final.png
          rm -f .github/scripts/switch-logo-to-final-png.py
          rm -f .github/workflows/switch-logo-to-final-png.yml

      - name: Commit reliable logo deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore reliable YK logo rendering across portfolio"
          git push origin HEAD:main
