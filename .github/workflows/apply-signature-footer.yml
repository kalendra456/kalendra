name: Apply signature footer

on:
  push:
    branches: ["main"]
    paths:
      - ".footer-signature/READY"

permissions:
  contents: write

jobs:
  apply-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply signature footer
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_signature_footer.py
          rm -rf .footer-signature
          rm -f .github/scripts/apply_signature_footer.py
          rm -f .github/workflows/apply-signature-footer.yml

      - name: Commit signature footer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add large signature wordmark and LinkedIn footer"
          git push origin HEAD:main
