name: Harden visual counter support

on:
  push:
    branches: ["visual-motion-upgrade"]
    paths:
      - ".counter-fix/READY"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v4
        with:
          ref: visual-motion-upgrade
          fetch-depth: 0

      - name: Add observer capability guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('script.js'); t=p.read_text(encoding='utf-8'); old='if (!reduceMotion && counterGroups.length) {'; new=\"if (!reduceMotion && counterGroups.length && 'IntersectionObserver' in window) {\"; assert old in t; p.write_text(t.replace(old, new, 1), encoding='utf-8')"
          node --check script.js
          grep -q "counterGroups.length && 'IntersectionObserver' in window" script.js
          rm -rf .counter-fix
          rm -f .github/workflows/fix-counter-guard.yml

      - name: Commit support guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden animated metric counters"
          git push origin HEAD:visual-motion-upgrade
