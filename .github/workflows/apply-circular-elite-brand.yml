name: Apply Circular Elite branding

on:
  push:
    branches:
      - circular-elite-brand
    paths:
      - .brand-update/READY

permissions:
  contents: write

jobs:
  apply-brand:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branding branch
        uses: actions/checkout@v4
        with:
          ref: circular-elite-brand
          fetch-depth: 0

      - name: Apply Circular Elite logo
        run: python3 .github/scripts/apply-circular-elite-brand.py

      - name: Remove temporary migration files
        run: |
          rm -rf .brand-update
          rm -f .github/scripts/apply-circular-elite-brand.py
          rm -f .github/workflows/apply-circular-elite-brand.yml

      - name: Commit completed branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Circular Elite logo across portfolio"
          git push origin HEAD:circular-elite-brand
