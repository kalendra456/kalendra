name: Validate recruiter functional polish

on:
  push:
    branches: ["recruiter-functional-polish"]
    paths:
      - ".recruiter-polish/VALIDATE"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: recruiter-functional-polish
          fetch-depth: 0

      - name: Validate JavaScript, HTML links, assets and disclosure boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          node --check lightbox.js

          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path('.').resolve()
          html_files = [Path('index.html'), Path('photo-gallery/index.html'), Path('case-studies/index.html'), Path('404.html')]

          class DocumentParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.references = []
                  self.lightboxes = 0
                  self.doctype = False
                  self.tags = Counter()

              def handle_decl(self, decl):
                  if decl.lower().startswith('doctype html'):
                      self.doctype = True

              def handle_starttag(self, tag, attrs):
                  self.tags[tag] += 1
                  values = dict(attrs)
                  if values.get('id'):
                      self.ids.append(values['id'])
                  if 'data-lightbox' in values:
                      self.lightboxes += 1
                  if tag in {'a', 'link'} and values.get('href'):
                      self.references.append(('href', values['href']))
                  if tag in {'img', 'script'} and values.get('src'):
                      self.references.append(('src', values['src']))

          parsed = {}
          for html_path in html_files:
              if not html_path.exists():
                  raise SystemExit(f'Missing HTML document: {html_path}')
              content = html_path.read_text(encoding='utf-8')
              parser = DocumentParser()
              parser.feed(content)
              parser.close()
              parsed[html_path.resolve()] = parser

              if not parser.doctype:
                  raise SystemExit(f'Missing HTML5 doctype: {html_path}')
              if parser.tags['html'] != 1 or parser.tags['head'] != 1 or parser.tags['body'] != 1:
                  raise SystemExit(f'Unexpected document structure in {html_path}: {parser.tags}')
              duplicates = [value for value, count in Counter(parser.ids).items() if count > 1]
              if duplicates:
                  raise SystemExit(f'Duplicate IDs in {html_path}: {duplicates}')

          def target_file(current_html: Path, raw_reference: str):
              parts = urlsplit(raw_reference)
              if parts.scheme or raw_reference.startswith('//'):
                  return None, parts.fragment

              path_text = unquote(parts.path)
              if not path_text:
                  return current_html.resolve(), parts.fragment

              if path_text in {'/kalendra', '/kalendra/'}:
                  candidate = root / 'index.html'
              elif path_text.startswith('/kalendra/'):
                  candidate = root / path_text.removeprefix('/kalendra/')
              elif path_text.startswith('/'):
                  return None, parts.fragment
              else:
                  candidate = (current_html.parent / path_text).resolve()

              if candidate.is_dir() or path_text.endswith('/'):
                  candidate = candidate / 'index.html'
              return candidate.resolve(), parts.fragment

          failures = []
          for current_html, parser in list(parsed.items()):
              current_path = Path(current_html)
              for attribute, reference in parser.references:
                  if reference.startswith(('mailto:', 'tel:', 'javascript:', 'data:')):
                      continue
                  candidate, fragment = target_file(current_path, reference)
                  if candidate is None:
                      continue
                  try:
                      candidate.relative_to(root)
                  except ValueError:
                      failures.append(f'{current_path}: reference escapes repository: {reference}')
                      continue
                  if not candidate.exists():
                      failures.append(f'{current_path}: missing local {attribute} target: {reference} -> {candidate.relative_to(root)}')
                      continue
                  if fragment and candidate.suffix.lower() in {'.html', '.htm'}:
                      target_parser = parsed.get(candidate.resolve())
                      if target_parser is None:
                          target_parser = DocumentParser()
                          target_parser.feed(candidate.read_text(encoding='utf-8'))
                          target_parser.close()
                          parsed[candidate.resolve()] = target_parser
                      if fragment not in target_parser.ids:
                          failures.append(f'{current_path}: missing fragment #{fragment} in {candidate.relative_to(root)}')

          if failures:
              raise SystemExit('\n'.join(failures))

          if parsed[Path('index.html').resolve()].lightboxes != 4:
              raise SystemExit('Main page should expose exactly four proof lightbox triggers')
          if parsed[Path('photo-gallery/index.html').resolve()].lightboxes < 13:
              raise SystemExit('Recognition gallery should expose at least thirteen proof lightbox triggers')

          resume = Path('assets/Yaswanth_Kalendra_Resume.pdf')
          data = resume.read_bytes()
          if not data.startswith(b'%PDF-') or len(data) < 8_000:
              raise SystemExit('Resume PDF is missing or invalid')
          if b'/Count 2' not in data:
              raise SystemExit('Resume PDF is expected to contain two pages')

          required = {
              Path('index.html'): ('recruiter-bar', 'Download resume (PDF)', 'credential-certified', 'case-studies/#wazuh-glpi'),
              Path('photo-gallery/index.html'): ('data-lightbox', '../lightbox.js?v=1'),
              Path('case-studies/index.html'): ('Four operational workstreams', 'Wazuh-to-GLPI Incident Orchestration', 'Offensive-first · Detection-informed'),
              Path('README.md'): ('Accessible, keyboard-operable proof lightbox', 'case-studies/'),
              Path('sitemap.xml'): ('/case-studies/',),
          }
          for path, phrases in required.items():
              content = path.read_text(encoding='utf-8')
              for phrase in phrases:
                  if phrase not in content:
                      raise SystemExit(f'Missing required phrase in {path}: {phrase}')

          public_text = '\n'.join(path.read_text(encoding='utf-8') for path in (Path('index.html'), Path('case-studies/index.html'), Path('README.md')))
          for forbidden in ('3958760', 'WorldIDSource', 'WorldIDSatellite', '16,777,216', 'CVSS 9.2', '$25K'):
              if forbidden in public_text:
                  raise SystemExit(f'Active private-report detail detected: {forbidden}')

          if public_text.index('Core offensive expertise') > public_text.index('Defensive depth'):
              raise SystemExit('Offensive-first content hierarchy was not preserved')

          print('Validation complete: JavaScript syntax, local links, fragments, IDs, lightboxes, resume PDF and disclosure boundaries passed.')
          PY

          rm -rf .recruiter-polish
          rm -f .github/workflows/validate-recruiter-polish.yml

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate recruiter functional polish"
          git push origin HEAD:recruiter-functional-polish
