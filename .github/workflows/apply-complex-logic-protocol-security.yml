name: Apply complex logic and protocol security positioning

on:
  push:
    branches: ["complex-logic-protocol-security"]
    paths:
      - ".protocol-positioning/READY"

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: complex-logic-protocol-security
          fetch-depth: 0

      - name: Add advanced protocol-security capability safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          index_path = Path('index.html')
          style_path = Path('style.css')
          gallery_path = Path('photo-gallery/index.html')
          readme_path = Path('README.md')
          fallback_path = Path('404.html')

          index = index_path.read_text(encoding='utf-8')
          style = style_path.read_text(encoding='utf-8')
          gallery = gallery_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Missing expected content for {label}')
              return text.replace(old, new, 1)

          # Refine the public narrative around technical impact and assessment ownership.
          index = replace_once(
              index,
              'Offensive-security portfolio of Yaswanth Kalendra, focused on VAPT, web and API penetration testing, application-security validation, exploitability analysis, remediation, and retesting—with practical SOC and detection-engineering context.',
              'Offensive-security portfolio of Yaswanth Kalendra, focused on VAPT, web and API penetration testing, application-security validation, complex logic and protocol security, remediation, and retesting—with practical SOC and detection-engineering context.',
              'meta description',
          )
          index = replace_once(
              index,
              'Offensive security, VAPT, application-security research, exploit validation, and end-to-end finding ownership backed by real-world results and defensive engineering context.',
              'Offensive security, VAPT, application-security research, complex logic and protocol validation, and end-to-end finding ownership backed by real-world results and defensive engineering context.',
              'Open Graph description',
          )
          index = replace_once(
              index,
              'VAPT, web and API penetration testing, application-security validation, and SOC-informed offensive security.',
              'VAPT, web and API penetration testing, application-security validation, protocol logic, and SOC-informed offensive security.',
              'Twitter description',
          )

          knows_marker = '      "Business Logic Testing",\n'
          knows_addition = (
              '      "Business Logic Testing",\n'
              '      "Complex Logic Security",\n'
              '      "Protocol Security",\n'
              '      "Smart Contract Security Review",\n'
              '      "State-Machine Analysis",\n'
              '      "Invariant Analysis",\n'
              '      "Resource Exhaustion Testing",\n'
          )
          index = replace_once(index, knows_marker, knows_addition, 'structured protocol expertise')

          old_hero = dedent('''
              I’m <strong>Yaswanth Kalendra</strong>, an offensive-security and application-security practitioner with 4+ years of independent web/API research. I can own an assessment workstream from scoping and threat hypotheses through manual exploitation, severity calibration, remediation guidance, and retesting. My research is measured by exploitability and business consequence—not by the payout ceiling of any single program. Hands-on SOC and detection-engineering experience adds operational context without diluting the offensive focus.
          ''').strip()
          new_hero = dedent('''
              I’m <strong>Yaswanth Kalendra</strong>, an offensive-security and application-security practitioner with 4+ years of independent web/API and source-assisted research. I lead assessment workstreams from attack-surface modelling and manual exploitation through severity calibration, remediation guidance, and retesting. My research is evaluated by exploitability, state integrity, and material business impact—not by the payout ceiling of any single program. Hands-on SOC and detection-engineering experience adds operational context without diluting the offensive focus.
          ''').strip()
          index = replace_once(index, old_hero, new_hero, 'hero narrative')
          index = replace_once(index, 'Manual + source-assisted validation', 'Manual, source-assisted &amp; protocol-aware', 'operating profile depth')
          index = replace_once(
              index,
              'My primary track is offensive security: manual web/API penetration testing, authentication and authorization analysis, business-logic abuse, source-assisted validation, and remediation retesting. Defensive engineering remains a supporting advantage that improves control awareness, logging expectations, and operational risk judgment.',
              'My primary track is offensive security: manual web/API penetration testing, authentication and authorization analysis, business-logic abuse, complex state-transition analysis, source-assisted validation, and remediation retesting. Defensive engineering remains a supporting advantage that improves control awareness, logging expectations, and operational risk judgment.',
              'expertise introduction',
          )
          index = replace_once(
              index,
              'Research-led web, API, and source-assisted assessments across 20+ private bug-bounty and responsible-disclosure programs, with an emphasis on manual validation and controlled finding delivery.',
              'Research-led web, API, identity, complex-logic, and source-assisted assessments across 20+ private bug-bounty and responsible-disclosure programs, with an emphasis on manual validation and controlled finding delivery.',
              'experience summary',
          )
          index = replace_once(
              index,
              '<li>Built role, object, and state-transition test matrices to identify BOLA/IDOR, privilege-boundary, and workflow-abuse conditions that automated tools commonly miss.</li>',
              '<li>Built role, object, state-transition, and resource-boundary test matrices to identify BOLA/IDOR, privilege-boundary, workflow-abuse, and systemic availability conditions that automated tools commonly miss.</li>',
              'experience protocol depth',
          )

          # Add a visually distinct advanced research track without naming or describing an active private report.
          expertise_start = index.index('<section class="section shell" id="expertise">')
          grid_start = index.index('<div class="expertise-grid">', expertise_start)
          grid_close = index.index('\n  </div>\n</section>', grid_start)
          insert_at = grid_close + len('\n  </div>')

          protocol_card = dedent('''

              <article class="protocol-research-card card" data-reveal>
                <div class="protocol-research-copy">
                  <div class="protocol-research-heading">
                    <div class="card-icon protocol-icon">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 6h5l2 3h7M5 18h5l2-3h7"></path>
                        <circle cx="4" cy="6" r="2"></circle>
                        <circle cx="20" cy="9" r="2"></circle>
                        <circle cx="4" cy="18" r="2"></circle>
                        <circle cx="20" cy="15" r="2"></circle>
                        <path d="M10 6v12M14 9v6"></path>
                      </svg>
                    </div>
                    <div>
                      <p class="eyebrow">Advanced research area</p>
                      <h3>Complex Logic &amp; Protocol Security</h3>
                    </div>
                  </div>
                  <p>
                    Source-assisted validation of state-machine transitions, cross-system trust boundaries, resource-exhaustion vectors, and atomic workflows. I evaluate failure modes that can materially affect protocol availability, state integrity, authorization, and downstream execution.
                  </p>
                  <p class="protocol-research-note">
                    This capability is presented at a methodology level; active private findings and target-identifying details remain excluded until disclosure is authorized.
                  </p>
                </div>
                <div class="protocol-capabilities" aria-label="Complex logic and protocol security capabilities">
                  <span>Protocol Logic</span>
                  <span>State Integrity</span>
                  <span>Smart Contract Review</span>
                  <span>Resource Boundaries</span>
                  <span>Invariant Analysis</span>
                  <span>Atomic Workflows</span>
                  <span>Availability Testing</span>
                  <span>Cross-System Trust</span>
                </div>
              </article>
          ''').rstrip()
          index = index[:insert_at] + protocol_card + index[insert_at:]

          # Make the defensive document actions explicit about their current format.
          index = index.replace('>Download documentation <span aria-hidden="true">↓</span></a>', '>Download technical documentation <small>(DOCX)</small> <span aria-hidden="true">↓</span></a>')

          # Cache-bust the shared stylesheet wherever it is referenced.
          index = index.replace('style.css?v=22', 'style.css?v=23')
          gallery = gallery.replace('../style.css?v=22', '../style.css?v=23')
          if fallback_path.exists():
              fallback = fallback_path.read_text(encoding='utf-8').replace('style.css?v=22', 'style.css?v=23')
              fallback_path.write_text(fallback, encoding='utf-8')

          protocol_css = dedent('''

              /* Advanced research: complex logic and protocol security */
              .protocol-research-card {
                position: relative;
                display: grid;
                overflow: hidden;
                align-items: center;
                grid-template-columns: minmax(0, 1.22fr) minmax(300px, .78fr);
                gap: clamp(1.6rem, 5vw, 4rem);
                margin-top: 1rem;
                border-color: color-mix(in srgb, var(--blue) 24%, var(--border));
                border-radius: var(--radius-xl);
                background:
                  radial-gradient(circle at 92% 10%, color-mix(in srgb, var(--blue) 17%, transparent), transparent 24rem),
                  linear-gradient(135deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent 42%),
                  linear-gradient(150deg, var(--surface-raised), var(--surface));
                padding: clamp(1.6rem, 4vw, 2.5rem);
                box-shadow: var(--shadow-md);
                transition: transform 320ms var(--ease), border-color 320ms var(--ease), box-shadow 320ms var(--ease);
              }

              .protocol-research-card::before {
                position: absolute;
                top: 0;
                left: -35%;
                width: 34%;
                height: 1px;
                background: linear-gradient(90deg, transparent, var(--accent), transparent);
                content: "";
                opacity: .72;
                animation: protocolScan 7s ease-in-out infinite;
              }

              .protocol-research-card::after {
                position: absolute;
                right: -7rem;
                bottom: -10rem;
                width: 24rem;
                height: 24rem;
                border-radius: 50%;
                background: color-mix(in srgb, var(--blue) 10%, transparent);
                content: "";
                filter: blur(12px);
              }

              .protocol-research-card:hover {
                transform: translateY(-5px);
                border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
                box-shadow: var(--shadow-lg);
              }

              .protocol-research-copy,
              .protocol-capabilities {
                position: relative;
                z-index: 1;
              }

              .protocol-research-heading {
                display: flex;
                align-items: flex-start;
                gap: 1rem;
                margin-bottom: 1rem;
              }

              .protocol-icon {
                flex: 0 0 auto;
                margin-bottom: 0;
                border-color: color-mix(in srgb, var(--blue) 30%, var(--border));
                background: linear-gradient(145deg, var(--accent-soft), var(--blue-soft));
                color: color-mix(in srgb, var(--accent) 65%, var(--blue));
              }

              .protocol-research-card h3 {
                margin: .15rem 0 0;
                font-size: clamp(1.75rem, 3.2vw, 2.55rem);
              }

              .protocol-research-copy > p:not(.protocol-research-note) {
                max-width: 760px;
                margin-bottom: 1rem;
                color: var(--muted-strong);
                font-size: .98rem;
                line-height: 1.78;
              }

              .protocol-research-note {
                max-width: 760px;
                margin: 0;
                border-left: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
                padding-left: .85rem;
                color: var(--muted);
                font-size: .76rem;
              }

              .protocol-capabilities {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: .65rem;
              }

              .protocol-capabilities span {
                display: flex;
                min-height: 46px;
                align-items: center;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: color-mix(in srgb, var(--bg-deep) 48%, transparent);
                color: var(--muted-strong);
                padding: .65rem .75rem;
                font-family: var(--font-mono);
                font-size: .68rem;
                font-weight: 760;
                letter-spacing: .025em;
                transition: transform var(--transition), border-color var(--transition), color var(--transition);
              }

              .protocol-capabilities span::before {
                width: 6px;
                height: 6px;
                flex: 0 0 auto;
                margin-right: .55rem;
                border-radius: 50%;
                background: linear-gradient(135deg, var(--accent), var(--blue));
                box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 45%, transparent);
                content: "";
              }

              .protocol-capabilities span:hover {
                transform: translateX(3px);
                border-color: color-mix(in srgb, var(--accent) 34%, var(--border));
                color: var(--text-strong);
              }

              .text-link small {
                color: var(--muted);
                font-size: .68rem;
                font-weight: 650;
              }

              @keyframes protocolScan {
                0%, 18% { transform: translateX(0); opacity: 0; }
                28%, 72% { opacity: .72; }
                82%, 100% { transform: translateX(400%); opacity: 0; }
              }
          ''').rstrip()

          css_marker = '\n/* Methodology */'
          if css_marker not in style:
              raise SystemExit('Unable to locate methodology CSS marker')
          style = style.replace(css_marker, protocol_css + css_marker, 1)
          style += dedent('''

              @media (max-width: 860px) {
                .protocol-research-card {
                  grid-template-columns: 1fr;
                }
              }

              @media (max-width: 540px) {
                .protocol-research-heading {
                  display: block;
                }

                .protocol-research-heading .card-icon {
                  margin-bottom: 1rem;
                }

                .protocol-capabilities {
                  grid-template-columns: 1fr;
                }
              }

              @media (prefers-reduced-motion: reduce) {
                .protocol-research-card::before {
                  animation: none;
                  opacity: 0;
                }
              }
          ''')

          readme = replace_once(
              readme,
              '- Manual web/API exploitation, authorization testing, business-logic analysis, SAST/DAST correlation, and source-assisted validation',
              '- Manual web/API exploitation, authorization testing, business-logic analysis, complex protocol and state-machine reasoning, SAST/DAST correlation, and source-assisted validation',
              'README advanced research bullet',
          )
          readme = replace_once(
              readme,
              '- Critical-impact research framed around exploitability and business consequence, with confirmed bounty amounts used as supporting evidence rather than a capability ceiling',
              '- Critical-impact research framed around exploitability, state integrity, availability, and business consequence, with confirmed bounty amounts used as supporting evidence rather than a capability ceiling',
              'README impact bullet',
          )

          # Safety and quality checks: no active target/report details may enter public files.
          combined = index + gallery + readme
          forbidden = (
              'Tools for Humanity',
              '#3958760',
              'WorldIDSource',
              'WorldIDSatellite',
              'OPRF',
              '16,777,216',
              '$25K',
              'CVSS 9.2',
          )
          for item in forbidden:
              if item in combined:
                  raise SystemExit(f'Private active-report detail detected in public content: {item}')

          required = (
              'Complex Logic &amp; Protocol Security',
              'Protocol Logic',
              'State Integrity',
              'Smart Contract Review',
              'Resource Boundaries',
              'Invariant Analysis',
              'Atomic Workflows',
              'active private findings and target-identifying details remain excluded',
          )
          for item in required:
              if item not in index:
                  raise SystemExit(f'Missing required protocol positioning content: {item}')

          index_path.write_text(index, encoding='utf-8')
          style_path.write_text(style, encoding='utf-8')
          gallery_path.write_text(gallery, encoding='utf-8')
          readme_path.write_text(readme, encoding='utf-8')
          PY

          rm -rf .protocol-positioning
          rm -f .github/workflows/apply-complex-logic-protocol-security.yml

      - name: Commit portfolio refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complex logic and protocol security track"
          git push origin HEAD:complex-logic-protocol-security
