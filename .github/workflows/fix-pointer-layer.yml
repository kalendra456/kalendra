name: Fix pointer spotlight layering

on:
  push:
    branches: ["visual-motion-upgrade"]
    paths:
      - ".motion-fix/READY"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v4
        with:
          ref: visual-motion-upgrade
          fetch-depth: 0

      - name: Restore absolute spotlight positioning
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('style.css'); t=p.read_text(encoding='utf-8'); old='.pointer-spotlight { z-index: 4; }'; new='.pointer-spotlight { position: absolute; z-index: 4; }'; assert old in t; p.write_text(t.replace(old, new), encoding='utf-8')"
          grep -q ".pointer-spotlight { position: absolute; z-index: 4; }" style.css
          rm -rf .motion-fix
          rm -f .github/workflows/fix-pointer-layer.yml

      - name: Commit layering fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix pointer spotlight layering"
          git push origin HEAD:visual-motion-upgrade
