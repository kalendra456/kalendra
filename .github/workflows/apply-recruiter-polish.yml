name: Apply recruiter functional polish

on:
  push:
    branches: ["recruiter-functional-polish"]
    paths:
      - ".recruiter-polish/READY"

permissions:
  contents: write

jobs:
  apply-polish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out recruiter polish branch
        uses: actions/checkout@v4
        with:
          ref: recruiter-functional-polish
          fetch-depth: 0

      - name: Apply recruiter-focused improvements
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-recruiter-polish.py

          rm -rf .recruiter-polish
          rm -f .github/scripts/apply-recruiter-polish.py
          rm -f .github/workflows/apply-recruiter-polish.yml

      - name: Commit completed polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add recruiter-focused functional polish"
          git push origin HEAD:recruiter-functional-polish
