name: Cleanup portfolio update artifacts

on:
  push:
    branches: ["gov-proof-final"]
    paths:
      - ".cleanup/READY"

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Close temporary transfer issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for issue in 3 4; do
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${issue}" -f state=closed >/dev/null 2>&1 || true
          done

      - name: Remove temporary feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for branch in private-government-proof-update private-government-proof-update-2 enterprise-portfolio-redesign; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done

      - name: Remove cleanup branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/gov-proof-final" >/dev/null 2>&1 || true
