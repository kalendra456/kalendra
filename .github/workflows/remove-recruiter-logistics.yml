name: Remove recruiter logistics bar

on:
  push:
    branches: ["remove-recruiter-logistics"]
    paths:
      - ".remove-recruiter-logistics/READY"

permissions:
  contents: write

jobs:
  remove-logistics:
    runs-on: ubuntu-latest

    steps:
      - name: Check out removal branch
        uses: actions/checkout@v4
        with:
          ref: remove-recruiter-logistics
          fetch-depth: 0

      - name: Remove logistics section and unused styles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          css_path = Path('polish.css')
          readme_path = Path('README.md')

          index = index_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          section_start = '<section class="recruiter-bar shell" aria-label="Recruiter logistics" data-reveal>'
          metrics_start = '<section class="metrics shell" aria-label="Professional impact" data-reveal>'

          if section_start not in index or metrics_start not in index:
              raise SystemExit('Recruiter logistics section markers were not found')

          start = index.index(section_start)
          end = index.index(metrics_start, start)
          index = index[:start] + metrics_start + index[end + len(metrics_start):]

          css_start = '/* Recruiter logistics */'
          css_end = '/* Certification hierarchy */'
          if css_start not in css or css_end not in css:
              raise SystemExit('Recruiter logistics CSS markers were not found')
          start = css.index(css_start)
          end = css.index(css_end, start)
          css = css[:start] + css[end:]

          # Remove every remaining responsive rule whose selector starts with
          # .recruiter-bar. This safely handles both single- and multi-line selectors.
          cleaned_lines = []
          skipping_rule = False
          for line in css.splitlines(keepends=True):
              if not skipping_rule and line.lstrip().startswith('.recruiter-bar'):
                  skipping_rule = True
                  continue
              if skipping_rule:
                  if line.strip() == '}':
                      skipping_rule = False
                  continue
              cleaned_lines.append(line)
          if skipping_rule:
              raise SystemExit('Unclosed recruiter logistics CSS rule encountered')
          css = ''.join(cleaned_lines)

          old_readme = '- Recruiter logistics bar, emphasized credential statuses, and prominent PDF resume actions'
          new_readme = '- Emphasized credential statuses and prominent PDF resume actions'
          if old_readme not in readme:
              raise SystemExit('README recruiter logistics entry was not found')
          readme = readme.replace(old_readme, new_readme, 1)

          for name, content in (('index.html', index), ('polish.css', css), ('README.md', readme)):
              if 'recruiter-bar' in content or 'Recruiter logistics' in content:
                  raise SystemExit(f'Recruiter logistics content remains in {name}')

          if metrics_start not in index:
              raise SystemExit('Professional-impact metrics section was damaged')
          if 'Download resume (PDF)' not in index:
              raise SystemExit('Unrelated resume action was accidentally removed')
          if 'credential-certified' not in index:
              raise SystemExit('Unrelated certification styling was accidentally removed')

          index_path.write_text(index, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          readme_path.write_text(readme, encoding='utf-8')
          PY

          node --check script.js
          node --check lightbox.js

          rm -rf .remove-recruiter-logistics
          rm -f .github/workflows/remove-recruiter-logistics.yml

      - name: Commit removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove recruiter logistics bar"
          git push origin HEAD:remove-recruiter-logistics
