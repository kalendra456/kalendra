name: Fix offensive positioning workflow

on:
  push:
    branches: ["offensive-first-positioning"]
    paths:
      - ".offensive-positioning/FIX"

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: offensive-first-positioning
          fetch-depth: 0

      - name: Patch structured-data replacement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-offensive-first-positioning.yml')
          text = path.read_text(encoding='utf-8')
          old = "          index = replace_required(index, old_knows, new_knows, 'structured expertise list')"
          new = """          import re
          index, knows_count = re.subn(
              r'    \\\"knowsAbout\\\": \\\[\\n.*?\\n    \\\]',
              new_knows,
              index,
              count=1,
              flags=re.S,
          )
          if knows_count != 1:
              raise SystemExit('Unable to replace structured expertise list')"""
          if old not in text:
              raise SystemExit('Expected workflow line was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .offensive-positioning/FIX
          rm -f .github/workflows/fix-offensive-positioning-workflow.yml

      - name: Commit workflow fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix offensive positioning workflow"
          git push origin HEAD:offensive-first-positioning
