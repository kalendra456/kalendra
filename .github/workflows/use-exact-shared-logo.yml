name: Use exact ChatGPT shared logo

on:
  push:
    branches:
      - main
    paths:
      - .logo-update/USE_EXACT_SHARED_LOGO

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact shared logo
        run: python3 .github/scripts/use-exact-shared-logo.py

      - name: Remove temporary migration files
        run: |
          rm -rf .logo-update
          rm -f .github/scripts/use-exact-shared-logo.py
          rm -f .github/workflows/use-exact-shared-logo.yml

      - name: Commit exact shared logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use exact ChatGPT-shared Circular Elite logo"
          git push origin HEAD:main
