name: Validate streamlined portfolio

on:
  push:
    branches: ["streamlined-portfolio-structure"]
    paths:
      - ".streamline/VALIDATE"

permissions:
  contents: write

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: streamlined-portfolio-structure
          fetch-depth: 0

      - name: Validate document structure and local references
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          node --check lightbox.js

          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path('.').resolve()
          index = Path('index.html').read_text(encoding='utf-8')
          css = Path('streamline.css').read_text(encoding='utf-8')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.references = []
                  self.tags = Counter()

              def handle_starttag(self, tag, attrs):
                  self.tags[tag] += 1
                  values = dict(attrs)
                  if values.get('id'):
                      self.ids.append(values['id'])
                  if tag in {'a', 'link'} and values.get('href'):
                      self.references.append(values['href'])
                  if tag in {'img', 'script'} and values.get('src'):
                      self.references.append(values['src'])

          parser = Parser()
          parser.feed(index)
          parser.close()

          duplicates = [value for value, count in Counter(parser.ids).items() if count > 1]
          if duplicates:
              raise SystemExit(f'Duplicate IDs in index.html: {duplicates}')
          if parser.tags['html'] != 1 or parser.tags['head'] != 1 or parser.tags['body'] != 1:
              raise SystemExit(f'Unexpected HTML structure: {parser.tags}')

          if index.count('streamline.css?v=1') != 1:
              raise SystemExit('streamline.css must be loaded exactly once')
          if index.index('typography.css?v=1') > index.index('streamline.css?v=1'):
              raise SystemExit('streamline.css must load after typography.css')
          if index.count('class="expertise-card') != 5:
              raise SystemExit('Expected exactly five expertise cards')
          if index.count('class="offensive-methodology-item"') != 4:
              raise SystemExit('Expected exactly four compact methodology items')

          operations = index[index.index('<section class="section shell" id="operations">'):index.index('<section class="section shell" id="capabilities">')]
          if operations.count('class="case-card card"') != 3:
              raise SystemExit('Expected exactly three grouped defensive cards')

          if index.index('Core offensive expertise') > index.index('Defensive depth'):
              raise SystemExit('Offensive-first content ordering was not preserved')

          for required in (
              'Complex Logic &amp; Protocol Security',
              'Authorization boundaries',
              'Code-to-runtime validation',
              'Finding governance',
              'Risk-based assessment planning',
              'Wazuh 5 SIEM &amp; Log Pipeline',
              'Unified SOC Observability',
              'Incident Workflow Automation',
          ):
              if required not in index:
                  raise SystemExit(f'Missing required content: {required}')

          for forbidden in ('3958760', 'WorldIDSource', 'WorldIDSatellite', '16,777,216', 'CVSS 9.2', '$25K'):
              if forbidden in index:
                  raise SystemExit(f'Active private-report detail detected: {forbidden}')

          # Lightweight CSS integrity check after stripping comments and quoted strings.
          import re
          css_check = re.sub(r'/\*.*?\*/', '', css, flags=re.S)
          css_check = re.sub(r'"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'', '', css_check)
          if css_check.count('{') != css_check.count('}'):
              raise SystemExit('Unbalanced CSS braces in streamline.css')

          def resolve_reference(raw: str):
              parts = urlsplit(raw)
              if parts.scheme or raw.startswith('//') or raw.startswith(('mailto:', 'tel:', 'javascript:', 'data:')):
                  return None
              path_text = unquote(parts.path)
              if not path_text:
                  return Path('index.html')
              candidate = Path(path_text)
              if path_text.startswith('/'):
                  return None
              if candidate.is_dir() or path_text.endswith('/'):
                  candidate = candidate / 'index.html'
              return candidate

          missing = []
          for reference in parser.references:
              candidate = resolve_reference(reference)
              if candidate is not None and not candidate.exists():
                  missing.append((reference, str(candidate)))
          if missing:
              raise SystemExit(f'Missing local references: {missing}')

          print('Structural validation passed: five expertise cards, one compact methodology panel, three defensive workstreams, valid links, and disclosure boundaries.')
          PY

      - name: Render desktop and mobile previews
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "A Chromium-compatible browser is unavailable on this runner." >&2
            exit 1
          fi

          mkdir -p /tmp/streamlined-preview
          python3 -m http.server 8000 >/tmp/streamlined-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=4500 --window-size=1440,2400 --screenshot=/tmp/streamlined-preview/expertise-desktop.png "http://127.0.0.1:8000/#expertise"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=4500 --window-size=1440,2400 --screenshot=/tmp/streamlined-preview/operations-desktop.png "http://127.0.0.1:8000/#operations"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=4500 --window-size=390,2200 --screenshot=/tmp/streamlined-preview/mobile.png "http://127.0.0.1:8000/#expertise"

          test -s /tmp/streamlined-preview/expertise-desktop.png
          test -s /tmp/streamlined-preview/operations-desktop.png
          test -s /tmp/streamlined-preview/mobile.png

      - name: Upload visual previews
        uses: actions/upload-artifact@v4
        with:
          name: streamlined-portfolio-preview
          path: /tmp/streamlined-preview/*.png
          retention-days: 2

      - name: Remove temporary validation files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .streamline
          rm -f .github/workflows/validate-streamlined-portfolio.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate streamlined portfolio layout"
          git push origin HEAD:streamlined-portfolio-structure
