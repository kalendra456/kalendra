name: Deploy KALENDRA OS

on:
  push:
    branches:
      - main
    paths:
      - .kalendra-os/READY

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract interactive workspace
        shell: bash
        run: |
          set -euo pipefail
          cat .kalendra-os/chunks/chunk-* > /tmp/kalendra-os-runtime.b64
          base64 -d /tmp/kalendra-os-runtime.b64 > /tmp/kalendra-os-runtime.tgz
          tar -xzf /tmp/kalendra-os-runtime.tgz

      - name: Integrate Recruiter View launcher
        run: python3 .kalendra-os/install.py

      - name: Remove temporary deployment files
        run: |
          rm -rf .kalendra-os
          rm -f .github/workflows/deploy-kalendra-os.yml

      - name: Commit KALENDRA OS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch KALENDRA OS interactive portfolio"
          git push origin HEAD:main
