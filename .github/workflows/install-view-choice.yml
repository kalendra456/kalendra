name: Publish and verify portfolio view chooser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-view-choice.yml
      - .github/scripts/install-view-choice.py
      - .github/scripts/check-view-choice.py
      - view-choice.js
      - view-choice.css

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact change
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate complete source files and integrate both pages
        run: |
          set -euo pipefail
          test "$(git hash-object view-choice.js)" = "a63583db87ee145a85fc10f6097c9c09828ae3d3"
          test "$(git hash-object view-choice.css)" = "953fccd5f76fdbd7ebe79e9c2240ccb4d05d5306"
          node --check view-choice.js
          python3 .github/scripts/install-view-choice.py

      - name: Install browser test tools
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome >/dev/null 2>&1; then
            python3 -m playwright install --with-deps chromium
          fi

      - name: Test both routes before publishing
        env:
          PORTFOLIO_URL: http://127.0.0.1:8765/kalendra/
          CHECK_OUTPUT: verification/local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .. >/tmp/view-choice-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 1
          python3 .github/scripts/check-view-choice.py

      - name: Commit verified integration and remove temporary installer
        run: |
          rm .github/scripts/install-view-choice.py .github/workflows/install-view-choice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html os/index.html .github/workflows/kalendra-os-live-check.yml .github/scripts/install-view-choice.py .github/workflows/install-view-choice.yml
          git commit -m "Ask visitors to choose Recruiter View or KALENDRA OS on both routes"
          git push origin HEAD:main

      - name: Wait for the updated public pages
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          base = 'https://kalendra456.github.io/kalendra/'
          for attempt in range(36):
              try:
                  ready = True
                  for route in ('', 'os/'):
                      url = base + route + '?view-check=' + str(time.time_ns())
                      req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=12) as response:
                          ready = ready and 'view-choice.js?v=1' in response.read().decode('utf-8')
                  if ready:
                      print('Both public entry points serve the shared chooser.', flush=True)
                      break
              except Exception as error:
                  print(type(error).__name__, flush=True)
              time.sleep(5)
          else:
              raise SystemExit('Pages deployment did not become visible in time')
          PY

      - name: Verify the live website in Chromium
        env:
          CHECK_OUTPUT: verification/live
        run: python3 .github/scripts/check-view-choice.py

      - name: Save browser checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-view-chooser-verification
          path: verification/
          retention-days: 7
