name: Apply critical-impact positioning

on:
  push:
    branches: ["critical-impact-positioning"]
    paths:
      - ".critical-impact-update/READY"

permissions:
  contents: write

jobs:
  update-positioning:
    runs-on: ubuntu-latest

    steps:
      - name: Check out positioning branch
        uses: actions/checkout@v4
        with:
          ref: critical-impact-positioning
          fetch-depth: 0

      - name: Reframe confirmed bounty as evidence, not a capability ceiling
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          readme_path = Path('README.md')

          index = index_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          index = replace_once(
              index,
              'I’m <strong>Yaswanth Kalendra</strong>, an offensive-security and application-security practitioner with 4+ years of independent web/API research. I can own an assessment workstream from scoping and threat hypotheses through manual exploitation, severity calibration, remediation guidance, and retesting. Hands-on SOC and detection-engineering experience adds operational context without diluting the offensive focus.',
              'I’m <strong>Yaswanth Kalendra</strong>, an offensive-security and application-security practitioner with 4+ years of independent web/API research. I can own an assessment workstream from scoping and threat hypotheses through manual exploitation, severity calibration, remediation guidance, and retesting. My research is measured by exploitability and business consequence—not by the payout ceiling of any single program. Hands-on SOC and detection-engineering experience adds operational context without diluting the offensive focus.',
              'hero impact framing',
          )

          index = replace_once(
              index,
              '''  <article>
    <strong>~$10K</strong>
    <p>Single critical finding reward in a Government Private Program</p>
  </article>''',
              '''  <article>
    <strong>Critical<span>-impact</span></strong>
    <p>High-impact vulnerabilities across identity, authorization, business logic, availability, and state integrity</p>
  </article>''',
              'headline impact metric',
          )

          index = replace_once(
              index,
              '<li>Reported a critical vulnerability in a Government Private Program that resulted in an approximately $10,000 single-finding reward.</li>',
              '<li>Produced high-impact vulnerability research across private programs, including one confirmed critical identity-control finding that received an approximately $10,000 single-report award.</li>',
              'experience outcome',
          )

          index = replace_once(
              index,
              '<span class="case-status"><i></i> Validated &amp; rewarded</span>',
              '<span class="case-status"><i></i> Confirmed critical outcome</span>',
              'featured case status',
          )

          index = replace_once(
              index,
              '<p>Mapped identity transitions and trust decisions across a complex authentication workflow, designed negative-control tests, and demonstrated an exploitable control failure with clear impact evidence while preserving responsible-disclosure boundaries.</p>',
              '<p>Mapped identity transitions and trust decisions across a complex authentication workflow, designed negative-control tests, and demonstrated an exploitable control failure with clear impact evidence while preserving responsible-disclosure boundaries. One confirmed report received an approximately $10K award; reward levels are program-specific, so this case is presented as evidence of validated business impact rather than a ceiling on research capability.</p>',
              'featured case narrative',
          )

          index = replace_once(
              index,
              '<div><strong>Result</strong><span>Critical · approximately $10K reward</span></div>',
              '<div><strong>External validation</strong><span>Confirmed critical · approximately $10K award</span></div>',
              'featured case outcome grid',
          )

          index = replace_once(
              index,
              '<div><strong>Critical</strong><span>Government Private Program finding</span></div>',
              '<div><strong>Critical impact</strong><span>Confirmed private-program finding</span></div>',
              'recognition metric',
          )

          readme = replace_once(
              readme,
              '- Independent bug-bounty and responsible-disclosure impact backed by public recognition evidence',
              '- Critical-impact research framed around exploitability and business consequence, with confirmed bounty amounts used as supporting evidence rather than a capability ceiling',
              'README positioning',
          )

          forbidden = (
              '<strong>~$10K</strong>',
              'Single critical finding reward in a Government Private Program',
              'Critical · approximately $10K reward',
          )
          for phrase in forbidden:
              if phrase in index:
                  raise SystemExit(f'Old payout-ceiling framing remains: {phrase}')

          required = (
              'Critical<span>-impact</span>',
              'My research is measured by exploitability and business consequence—not by the payout ceiling of any single program.',
              'Confirmed critical outcome',
              'evidence of validated business impact rather than a ceiling on research capability',
              'External validation',
              'Confirmed critical · approximately $10K award',
              'Critical impact',
          )
          for phrase in required:
              if phrase not in index:
                  raise SystemExit(f'Required updated wording is missing: {phrase}')

          # Do not introduce claims about unresolved private reports or possible future payouts.
          speculative = ('Tools for Humanity', 'HackerOne report', '$25K', '$25,000', 'pending program review')
          for phrase in speculative:
              if phrase in index:
                  raise SystemExit(f'Private or speculative active-report claim detected: {phrase}')

          index_path.write_text(index, encoding='utf-8')
          readme_path.write_text(readme, encoding='utf-8')
          PY

          rm -rf .critical-impact-update
          rm -f .github/workflows/apply-critical-impact-positioning.yml

      - name: Commit critical-impact update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reframe critical-impact research beyond a single bounty"
          git push origin HEAD:critical-impact-positioning
