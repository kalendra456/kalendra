name: Preview streamlined portfolio layout

on:
  push:
    branches: ["streamlined-portfolio-structure"]
    paths:
      - ".streamline-preview/READY"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: streamlined-portfolio-structure
          fetch-depth: 0

      - name: Install lightweight browser controller
        shell: bash
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Render deterministic section previews
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "A Chromium-compatible browser is unavailable." >&2
            exit 1
          fi

          mkdir -p /tmp/streamlined-layout-preview
          python3 -m http.server 8000 >/tmp/streamlined-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2

          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const path = require('path');

          const chromePath = process.env.CHROME_PATH;
          const baseUrl = 'http://127.0.0.1:8000/';
          const output = '/tmp/streamlined-layout-preview';

          const browser = await puppeteer.launch({
            executablePath: chromePath,
            headless: true,
            args: [
              '--no-sandbox',
              '--disable-setuid-sandbox',
              '--disable-dev-shm-usage',
              '--disable-gpu',
              '--hide-scrollbars'
            ]
          });

          async function prepare(page, viewport) {
            await page.setViewport(viewport);
            await page.evaluateOnNewDocument(() => {
              localStorage.setItem('portfolio-theme', 'dark');
            });
            await page.goto(baseUrl, { waitUntil: 'networkidle0', timeout: 60000 });
            await page.addStyleTag({ content: `
              html { scroll-behavior: auto !important; }
              *, *::before, *::after {
                animation-duration: 0s !important;
                animation-delay: 0s !important;
                transition-duration: 0s !important;
                caret-color: transparent !important;
              }
              [data-reveal],
              .hero-copy > *,
              .gallery-hero-copy > *,
              .console-heading,
              .profile-row,
              .signal-panel,
              .console-footer,
              .metrics article {
                opacity: 1 !important;
                visibility: visible !important;
                transform: none !important;
                filter: none !important;
              }
            ` });
            await page.evaluate(() => {
              document.documentElement.classList.remove('js');
              document.body.classList.remove('nav-open');
              document.querySelectorAll('[data-reveal]').forEach((node) => node.classList.add('is-visible'));
            });
            await new Promise((resolve) => setTimeout(resolve, 250));
          }

          async function captureSection(selector, filename, viewport) {
            const page = await browser.newPage();
            await prepare(page, viewport);
            const section = await page.$(selector);
            if (!section) throw new Error(`Missing section: ${selector}`);
            await section.screenshot({
              path: path.join(output, filename),
              captureBeyondViewport: true
            });
            await page.close();
          }

          await captureSection('#expertise', 'expertise-desktop.png', { width: 1440, height: 1200, deviceScaleFactor: 1 });
          await captureSection('#work', 'offensive-work-desktop.png', { width: 1440, height: 1500, deviceScaleFactor: 1 });
          await captureSection('#operations', 'defensive-workstreams-desktop.png', { width: 1440, height: 1200, deviceScaleFactor: 1 });
          await captureSection('#expertise', 'expertise-mobile.png', { width: 390, height: 900, deviceScaleFactor: 1 });
          await captureSection('#operations', 'defensive-workstreams-mobile.png', { width: 390, height: 900, deviceScaleFactor: 1 });

          await browser.close();
          NODE

          for image in /tmp/streamlined-layout-preview/*.png; do
            test -s "$image"
          done

      - name: Upload visual previews
        uses: actions/upload-artifact@v4
        with:
          name: streamlined-layout-preview
          path: /tmp/streamlined-layout-preview/*.png
          retention-days: 2

      - name: Remove temporary preview files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .streamline-preview node_modules package-lock.json
          rm -f .github/workflows/preview-streamlined-layout.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render streamlined portfolio previews"
          git push origin HEAD:streamlined-portfolio-structure
