name: Apply streamlined portfolio structure

on:
  push:
    branches: ["streamlined-portfolio-structure"]
    paths:
      - ".streamline/READY"

permissions:
  contents: write

jobs:
  streamline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: streamlined-portfolio-structure
          fetch-depth: 0

      - name: Consolidate portfolio content
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-streamlined-portfolio.py

          rm -rf .streamline
          rm -f .github/scripts/apply-streamlined-portfolio.py
          rm -f .github/workflows/apply-streamlined-portfolio.yml

      - name: Commit streamlined layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Streamline portfolio content hierarchy"
          git push origin HEAD:streamlined-portfolio-structure
