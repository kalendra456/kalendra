}

@media (prefers-reduced-motion: reduce) {
  .orb-one,
  .orb-two,
  .grid-plane,
  .grid-plane::after,
  .site-header::after,
  .gallery-header::after,
  .scroll-progress span,
  .eyebrow::before,
  .hero h1 span,
  .availability-chip::before,
  .hero-visual::before,
  .hero-visual::after,
  .security-console::before,
  .security-console::after,
  .console-state i,
  .console-footer i,
