  88%, 100% { transform: translateX(760%) rotate(17deg); opacity: 0; }
}

@keyframes console-scan {
  0%, 7% { transform: translateY(-35%); opacity: 0; }
  16% { opacity: .65; }
  77% { opacity: .42; }
  92%, 100% { transform: translateY(525%); opacity: 0; }
}

.console-state i,
.console-footer i {
  box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 45%, transparent);
  animation: verified-signal 2.2s ease-out infinite;
}

@keyframes verified-signal {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 42%, transparent); }
  72%, 100% { box-shadow: 0 0 0 8px transparent; }
}

.js .hero-visual:not(.is-visible) .console-heading,
.js .hero-visual:not(.is-visible) .profile-row,
.js .hero-visual:not(.is-visible) .signal-panel,
.js .hero-visual:not(.is-visible) .console-footer {
  transform: translateY(14px);
  opacity: 0;
}

.js .hero-visual.is-visible .console-heading,
.js .hero-visual.is-visible .profile-row,
.js .hero-visual.is-visible .signal-panel,
.js .hero-visual.is-visible .console-footer {
  animation: console-item-enter 620ms var(--ease) both;
}

.js .hero-visual.is-visible .console-heading { animation-delay: 220ms; }
.js .hero-visual.is-visible .profile-row:nth-of-type(2) { animation-delay: 330ms; }
.js .hero-visual.is-visible .profile-row:nth-of-type(3) { animation-delay: 420ms; }
.js .hero-visual.is-visible .profile-row:nth-of-type(4) { animation-delay: 510ms; }
.js .hero-visual.is-visible .signal-panel { animation-delay: 620ms; }
.js .hero-visual.is-visible .console-footer { animation-delay: 780ms; }

@keyframes console-item-enter {
  from { transform: translateY(14px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.signal-line i {
  overflow: hidden;
}

.signal-line i::after {
  position: absolute;
  inset: 0;
  transform: translateX(-115%);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .2), transparent);
  content: "";
  animation: signal-bar-sweep 3.2s ease-in-out infinite;
}

.js .hero-visual:not(.is-visible) .signal-line i {
