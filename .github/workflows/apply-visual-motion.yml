  transform: scaleX(0);
  transform-origin: center;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--blue), transparent);
  content: "";
}

.js .metrics:not(.is-visible) article {
  transform: translateY(18px);
  opacity: 0;
}

.metrics.is-visible article {
