}

@keyframes metric-card-rise {
  from { transform: translateY(18px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes metric-line-reveal {
  from { transform: scaleX(0); opacity: 0; }
  to { transform: scaleX(1); opacity: .9; }
}

.gallery-card,
.case-card,
.timeline-content,
.capability-group,
.recognition-summary,
.gallery-overview,
.contact-panel,
.credentials-panel {
  position: relative;
