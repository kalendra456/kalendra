.js .hero-copy.is-visible > :nth-child(5),
.js .gallery-hero-copy.is-visible > :nth-child(5) { animation-delay: 350ms; }
.js .hero-copy.is-visible > :nth-child(6),
.js .gallery-hero-copy.is-visible > :nth-child(6) { animation-delay: 420ms; }

@keyframes staged-content-rise {
  from { transform: translateY(18px); filter: blur(7px); opacity: 0; }
  to { transform: translateY(0); filter: blur(0); opacity: 1; }
}

.section-heading,
