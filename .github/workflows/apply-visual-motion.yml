}

.metrics.is-visible article:nth-child(2) { animation-delay: 75ms; }
.metrics.is-visible article:nth-child(3) { animation-delay: 150ms; }
.metrics.is-visible article:nth-child(4) { animation-delay: 225ms; }

.metrics.is-visible article::after {
