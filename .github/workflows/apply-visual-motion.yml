name: Apply visual motion upgrade

on:
  push:
    branches: ["visual-motion-upgrade"]
    paths:
      - ".visual-motion/READY"

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out visual upgrade branch
        uses: actions/checkout@v4
        with:
          ref: visual-motion-upgrade
          fetch-depth: 0

      - name: Add enterprise visual motion layer
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "Visual motion layer v22" style.css; then
            printf '\n' >> style.css
            cat .visual-motion/visual.css >> style.css
            printf '\n.pointer-spotlight { z-index: 4; }\n' >> style.css
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')
          marker = '// Visual motion layer v22'

          if marker not in script:
              addition = Path('.visual-motion/visual.js').read_text(encoding='utf-8')
              closing = script.rfind('\n})();')
              if closing == -1:
                  raise SystemExit('Could not locate the script closure')
              script = script[:closing] + addition + script[closing:]
              script_path.write_text(script, encoding='utf-8')

          for html_path in Path('.').rglob('*.html'):
              text = html_path.read_text(encoding='utf-8')
              text = re.sub(r'(style\.css\?v=)\d+', r'\g<1>22', text)
              text = re.sub(r'(script\.js\?v=)\d+', r'\g<1>22', text)
              html_path.write_text(text, encoding='utf-8')
          PY

          node --check script.js
          grep -q "Visual motion layer v22" style.css
          grep -q "Visual motion layer v22" script.js
          grep -q "style.css?v=22" index.html
          grep -q "script.js?v=22" index.html
          grep -q "style.css?v=22" photo-gallery/index.html
          grep -q "script.js?v=22" photo-gallery/index.html

          rm -rf .visual-motion
          rm -f .github/workflows/apply-visual-motion.yml

      - name: Commit visual motion upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enhance portfolio animations and visuals"
          git push origin HEAD:visual-motion-upgrade
