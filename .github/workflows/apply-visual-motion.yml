}

@keyframes hero-halo-one {
  from { transform: translate3d(0, 0, 0) scale(.9); opacity: .62; }
  to { transform: translate3d(-2rem, 2rem, 0) scale(1.15); opacity: 1; }
}

@keyframes hero-halo-two {
  from { transform: translate3d(0, 0, 0) scale(1.06); opacity: .75; }
