}

.js .hero-visual.is-visible .signal-line i {
  animation: signal-bar-grow 1.05s var(--ease) both;
}

.js .hero-visual.is-visible .signal-line:nth-child(2) i { animation-delay: 720ms; }
.js .hero-visual.is-visible .signal-line:nth-child(3) i { animation-delay: 820ms; }
.js .hero-visual.is-visible .signal-line:nth-child(4) i { animation-delay: 920ms; }
.js .hero-visual.is-visible .signal-line:nth-child(5) i { animation-delay: 1020ms; }

@keyframes signal-bar-grow {
  from { width: 0; }
  to { width: var(--level); }
}

@keyframes signal-bar-sweep {
  0%, 38% { transform: translateX(-115%); opacity: 0; }
  50% { opacity: 1; }
  82%, 100% { transform: translateX(115%); opacity: 0; }
}

.metrics article {
  position: relative;
  overflow: hidden;
  transition: transform 320ms var(--ease), background 320ms var(--ease), box-shadow 320ms var(--ease);
}

.metrics article::after {
