name: Apply visual motion upgrade

on:
  push:
    branches: ["visual-motion-upgrade"]
    paths:
      - ".visual-motion/READY"

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out visual upgrade branch
        uses: actions/checkout@v4
        with:
          ref: visual-motion-upgrade
          fetch-depth: 0

      - name: Add enterprise visual motion layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('style.css')
          js_path = Path('script.js')

          css = css_path.read_text(encoding='utf-8')
          css_marker = '/* Visual motion layer v22 */'
          css_block = r'''

/* Visual motion layer v22 */
:root {
  --ambient-x: 50%;
  --ambient-y: 18%;
  --ambient-shift-x: 0px;
  --ambient-shift-y: 0px;
}

.site-backdrop::before {
  position: absolute;
  inset: -12%;
  background:
    radial-gradient(650px circle at var(--ambient-x) var(--ambient-y), color-mix(in srgb, var(--accent) 11%, transparent), transparent 68%),
    radial-gradient(540px circle at calc(100% - var(--ambient-x)) calc(100% - var(--ambient-y)), color-mix(in srgb, var(--blue) 9%, transparent), transparent 70%);
  content: "";
  opacity: .95;
  transform: translate3d(var(--ambient-shift-x), var(--ambient-shift-y), 0);
  transition: transform 140ms linear;
  will-change: transform;
}

.gallery-body {
  background:
    radial-gradient(circle at var(--ambient-x) calc(var(--ambient-y) - 8%), var(--accent-soft), transparent 35rem),
    radial-gradient(circle at calc(100% - var(--ambient-x)) calc(100% - var(--ambient-y)), var(--blue-soft), transparent 30rem),
    var(--bg);
}

.orb-one {
  animation: ambient-orb-one 18s ease-in-out infinite alternate;
}

.orb-two {
  animation: ambient-orb-two 22s ease-in-out infinite alternate;
}

.grid-plane {
  animation: ambient-grid-drift 28s linear infinite;
}

.grid-plane::after {
  position: absolute;
  inset: -28% 0 auto;
  height: 28%;
  background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--accent) 11%, transparent), transparent);
  content: "";
  opacity: .7;
  animation: ambient-grid-scan 10s cubic-bezier(.36, .02, .26, 1) infinite;
}

@keyframes ambient-orb-one {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  45% { transform: translate3d(-4rem, 3rem, 0) scale(1.08); }
  100% { transform: translate3d(-1rem, 8rem, 0) scale(.94); }
}

@keyframes ambient-orb-two {
  0% { transform: translate3d(0, 0, 0) scale(.96); }
  50% { transform: translate3d(5rem, -2rem, 0) scale(1.08); }
  100% { transform: translate3d(1rem, -7rem, 0) scale(1); }
}

@keyframes ambient-grid-drift {
  from { background-position: 0 0, 0 0; }
  to { background-position: 64px 64px, 64px 64px; }
}

@keyframes ambient-grid-scan {
  0%, 8% { transform: translateY(-20%); opacity: 0; }
  18% { opacity: .7; }
  72% { opacity: .45; }
  92%, 100% { transform: translateY(490%); opacity: 0; }
}

.site-header::after,
.gallery-header::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 5%, var(--accent), var(--blue), transparent 95%);
  background-size: 220% 100%;
  content: "";
  opacity: 0;
  animation: header-energy-flow 6s linear infinite;
  transition: opacity var(--transition);
}

.site-header.is-scrolled::after,
.gallery-header::after {
  opacity: .66;
}

@keyframes header-energy-flow {
  from { background-position: 200% 0; }
  to { background-position: -20% 0; }
}

.scroll-progress span {
  background-size: 200% 100%;
  animation: progress-energy-flow 3.2s linear infinite;
}

@keyframes progress-energy-flow {
  from { background-position: 0 0; }
  to { background-position: 200% 0; }
}

.brand-mark {
  transition: transform 360ms var(--ease), filter 360ms var(--ease);
}

.brand:hover .brand-mark {
  transform: rotate(-4deg) scale(1.055);
  filter: drop-shadow(0 12px 25px color-mix(in srgb, var(--accent) 28%, transparent));
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: .55rem;
}

.eyebrow::before {
  width: 20px;
  height: 1px;
  flex: 0 0 auto;
  background: linear-gradient(90deg, var(--accent), var(--blue));
  box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 42%, transparent);
  content: "";
  animation: eyebrow-signal 3.4s ease-in-out infinite;
}

@keyframes eyebrow-signal {
  0%, 100% { transform: scaleX(.65); transform-origin: left; opacity: .55; }
  50% { transform: scaleX(1.2); transform-origin: left; opacity: 1; }
}

@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .hero h1 span {
    background: linear-gradient(100deg, var(--muted) 5%, var(--text-strong) 34%, var(--accent) 52%, var(--blue) 64%, var(--muted) 92%);
    background-size: 240% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hero-title-sheen 7.5s ease-in-out infinite;
  }
}

@keyframes hero-title-sheen {
  0%, 18% { background-position: 110% 0; }
  62%, 100% { background-position: -90% 0; }
}

.availability-chip {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

.availability-chip::before {
  position: absolute;
  z-index: -1;
  top: -70%;
  bottom: -70%;
  left: -45%;
  width: 24%;
  transform: rotate(18deg);
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--success) 28%, transparent), transparent);
  content: "";
  animation: chip-verification-sweep 4.8s ease-in-out infinite;
}

@keyframes chip-verification-sweep {
  0%, 54% { transform: translateX(0) rotate(18deg); opacity: 0; }
  61% { opacity: 1; }
  82%, 100% { transform: translateX(680%) rotate(18deg); opacity: 0; }
}

.js .hero-copy:not(.is-visible) > *,
.js .gallery-hero-copy:not(.is-visible) > * {
