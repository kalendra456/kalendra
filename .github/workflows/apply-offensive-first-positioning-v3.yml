name: Apply offensive-first portfolio positioning v3

on:
  push:
    branches: ["offensive-first-positioning"]
    paths:
      - ".offensive-positioning/READY_V3"

permissions:
  contents: write

jobs:
  reposition-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out positioning branch
        uses: actions/checkout@v4
        with:
          ref: offensive-first-positioning
          fetch-depth: 0

      - name: Run offensive-first transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-offensive-first-positioning.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)

          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)

          old = "index = replace_required(index, old_knows, new_knows, 'structured expertise list')"
          replacement_lines = [
              "old_knows_indented = '    ' + old_knows.replace('\\n', '\\n    ')",
              "new_knows_indented = '    ' + new_knows.replace('\\n', '\\n    ')",
              "index = replace_required(index, old_knows_indented, new_knows_indented, 'structured expertise list')",
          ]
          replacement = "\n".join(replacement_lines)

          if old not in script:
              raise SystemExit('Structured-data replacement line was not found')
          script = script.replace(old, replacement, 1)
          exec(compile(script, '/tmp/apply-offensive-positioning.py', 'exec'), {})
          PY

          rm -rf .offensive-positioning

      - name: Commit positioning update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html photo-gallery/index.html README.md .offensive-positioning
          git commit -m "Prioritize offensive security positioning"
          git push origin HEAD:offensive-first-positioning
