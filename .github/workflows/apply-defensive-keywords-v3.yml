name: Apply defensive keyword refinement v3

on:
  push:
    branches:
      - siem-edr-soar-positioning
    paths:
      - .defensive-keywords/READY_V3

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: siem-edr-soar-positioning
          fetch-depth: 0

      - name: Apply verified content updates
        run: |
          python3 .github/scripts/apply-defensive-keywords.py
          rm -rf .defensive-keywords
          rm -f .github/scripts/apply-defensive-keywords.py
          rm -f .github/workflows/apply-defensive-keywords.yml
          rm -f .github/workflows/apply-defensive-keywords-v2.yml
          rm -f .github/workflows/apply-defensive-keywords-v3.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add accurate SIEM EDR and SOAR-aligned positioning"
          git push origin HEAD:siem-edr-soar-positioning
