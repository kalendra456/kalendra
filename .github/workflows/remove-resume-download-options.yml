name: Remove resume download options

on:
  push:
    branches: ["main"]
    paths:
      - ".resume-ui/REMOVE"

permissions:
  contents: write

jobs:
  remove-resume-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove resume download controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_paths = [Path('index.html'), Path('case-studies/index.html')]
          pattern = re.compile(
              r'\n?\s*<a\b[^>]*href="(?:\.\./)?assets/Yaswanth_Kalendra_Resume\.pdf"[^>]*>.*?</a>',
              re.S,
          )

          total_removed = 0
          for path in html_paths:
              text = path.read_text(encoding='utf-8')
              text, count = pattern.subn('', text)
              total_removed += count
              if 'Yaswanth_Kalendra_Resume.pdf' in text:
                  raise SystemExit(f'Resume link remains in {path}')
              path.write_text(text, encoding='utf-8')

          if total_removed < 5:
              raise SystemExit(f'Expected at least five resume UI links, removed only {total_removed}')

          css_path = Path('polish.css')
          css = css_path.read_text(encoding='utf-8')
          css, css_count = re.subn(
              r'\n\.resume-button\s*\{.*?\}\n',
              '\n',
              css,
              count=1,
              flags=re.S,
          )
          if css_count != 1:
              raise SystemExit('Expected resume-button CSS block was not found')
          css_path.write_text(css, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '- Emphasized credential statuses and prominent PDF resume actions',
              '- Emphasized credential statuses and recruiter-focused conversion actions',
          )
          readme_path.write_text(readme, encoding='utf-8')

          for path in html_paths:
              text = path.read_text(encoding='utf-8')
              for forbidden in ('Download resume', 'Resume PDF', 'resume-button', 'Yaswanth_Kalendra_Resume.pdf'):
                  if forbidden in text:
                      raise SystemExit(f'Resume download UI still present in {path}: {forbidden}')
          PY

          rm -rf .resume-ui
          rm -f .github/workflows/remove-resume-download-options.yml

      - name: Commit removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove resume download options from portfolio"
          git push origin HEAD:main
