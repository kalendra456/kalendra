name: Apply cursor interactions

on:
  push:
    branches: ["cursor-interactions"]
    paths:
      - ".cursor-interactions/READY"

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out interaction branch
        uses: actions/checkout@v4
        with:
          ref: cursor-interactions
          fetch-depth: 0

      - name: Add pointer-following interaction layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('style.css')
          js_path = Path('script.js')

          css = css_path.read_text(encoding='utf-8')
          css_marker = '/* Pointer interaction layer v21 */'
          css_block = r'''

/* Pointer interaction layer v21 */
.cursor-aura,
.cursor-dot {
  position: fixed;
  z-index: 9998;
  top: 0;
  left: 0;
  pointer-events: none;
  opacity: 0;
  transform: translate3d(-120px, -120px, 0) translate(-50%, -50%);
  will-change: transform, opacity;
}

.cursor-aura {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 18%, transparent) 0%, color-mix(in srgb, var(--blue) 8%, transparent) 34%, transparent 70%);
  filter: blur(4px);
  transition: width 240ms var(--ease), height 240ms var(--ease), opacity 180ms var(--ease), filter 240ms var(--ease);
}

.cursor-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 14%, transparent), 0 0 24px color-mix(in srgb, var(--accent) 55%, transparent);
  transition: width 180ms var(--ease), height 180ms var(--ease), opacity 140ms var(--ease), background 180ms var(--ease);
}

.pointer-effects-enabled .cursor-aura.is-visible,
.pointer-effects-enabled .cursor-dot.is-visible {
  opacity: 1;
}

.pointer-effects-enabled .cursor-aura.is-interactive {
  width: 116px;
  height: 116px;
  filter: blur(2px);
}

.pointer-effects-enabled .cursor-dot.is-interactive {
  width: 11px;
  height: 11px;
  background: var(--blue);
}

.pointer-tilt {
  position: relative;
  transform-style: preserve-3d;
  will-change: transform;
  transition: transform 180ms var(--ease), border-color 320ms var(--ease), box-shadow 320ms var(--ease);
}

.pointer-spotlight {
  position: absolute;
  z-index: 4;
  inset: -1px;
  overflow: hidden;
  border-radius: inherit;
  background: radial-gradient(360px circle at var(--spot-x, 50%) var(--spot-y, 50%), color-mix(in srgb, var(--accent) 14%, transparent), color-mix(in srgb, var(--blue) 6%, transparent) 34%, transparent 67%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 220ms var(--ease);
}

.pointer-tilt.is-pointer-active .pointer-spotlight {
  opacity: 1;
}

.pointer-tilt.is-pointer-active {
  border-color: color-mix(in srgb, var(--accent) 38%, var(--border));
  box-shadow: 0 26px 70px color-mix(in srgb, var(--bg-deep) 76%, transparent), 0 0 0 1px color-mix(in srgb, var(--accent) 9%, transparent);
}

.pointer-tilt .gallery-image img,
.pointer-tilt > img {
  will-change: transform;
}

.pointer-magnetic {
  will-change: translate;
  transition: translate 180ms var(--ease), transform var(--transition), box-shadow var(--transition), filter var(--transition), border-color var(--transition), background var(--transition);
}

@media (pointer: coarse), (hover: none), (prefers-reduced-motion: reduce) {
  .cursor-aura,
  .cursor-dot,
  .pointer-spotlight {
    display: none !important;
  }

  .pointer-tilt {
    transform: none !important;
  }

  .pointer-magnetic {
    translate: none !important;
  }
}
'''

          if css_marker not in css:
              css = css.rstrip() + css_block + '\n'
              css_path.write_text(css, encoding='utf-8')

          js = js_path.read_text(encoding='utf-8')
          js_marker = '  // Pointer interaction layer v21'
          js_block = r'''

  // Pointer interaction layer v21
  const finePointer = window.matchMedia('(pointer: fine)').matches;
  const hoverPointer = window.matchMedia('(hover: hover)').matches;

  if (!reduceMotion && finePointer && hoverPointer) {
    body.classList.add('pointer-effects-enabled');

    const cursorAura = document.createElement('div');
    const cursorDot = document.createElement('div');
    cursorAura.className = 'cursor-aura';
    cursorDot.className = 'cursor-dot';
    cursorAura.setAttribute('aria-hidden', 'true');
    cursorDot.setAttribute('aria-hidden', 'true');
    body.append(cursorAura, cursorDot);

    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let auraX = targetX;
    let auraY = targetY;
    let pointerFrame = 0;

    const placePointer = (element, x, y) => {
      element.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
    };

    const renderPointer = () => {
      auraX += (targetX - auraX) * 0.16;
      auraY += (targetY - auraY) * 0.16;
      placePointer(cursorAura, auraX, auraY);
      placePointer(cursorDot, targetX, targetY);

      if (Math.abs(targetX - auraX) > 0.08 || Math.abs(targetY - auraY) > 0.08) {
        pointerFrame = window.requestAnimationFrame(renderPointer);
      } else {
        pointerFrame = 0;
      }
    };

    const wakePointer = () => {
      if (!pointerFrame) pointerFrame = window.requestAnimationFrame(renderPointer);
    };

    const setPointerVisible = (visible) => {
      cursorAura.classList.toggle('is-visible', visible);
      cursorDot.classList.toggle('is-visible', visible);
    };

    window.addEventListener('pointermove', (event) => {
      if (event.pointerType && event.pointerType !== 'mouse' && event.pointerType !== 'pen') return;
      targetX = event.clientX;
      targetY = event.clientY;
      setPointerVisible(true);
      wakePointer();
    }, { passive: true });

    document.addEventListener('pointerleave', () => setPointerVisible(false));
    window.addEventListener('blur', () => setPointerVisible(false));

    const interactiveSelector = 'a, button, .gallery-card, .case-card, .gallery-overview, .recognition-summary';
    document.addEventListener('pointerover', (event) => {
      const target = event.target instanceof Element ? event.target.closest(interactiveSelector) : null;
      const active = Boolean(target);
      cursorAura.classList.toggle('is-interactive', active);
      cursorDot.classList.toggle('is-interactive', active);
    });

    document.addEventListener('pointerout', (event) => {
      const next = event.relatedTarget instanceof Element ? event.relatedTarget.closest(interactiveSelector) : null;
      if (next) return;
      cursorAura.classList.remove('is-interactive');
      cursorDot.classList.remove('is-interactive');
    });

    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
    const tiltTargets = document.querySelectorAll('.gallery-card, .case-card, .gallery-overview, .recognition-summary');

    tiltTargets.forEach((card) => {
      card.classList.add('pointer-tilt');
      const spotlight = document.createElement('i');
      spotlight.className = 'pointer-spotlight';
      spotlight.setAttribute('aria-hidden', 'true');
      card.appendChild(spotlight);

      const image = card.querySelector('.gallery-image img, img');

      card.addEventListener('pointerenter', () => {
        card.classList.add('is-pointer-active');
      });

      card.addEventListener('pointermove', (event) => {
        const rect = card.getBoundingClientRect();
        if (!rect.width || !rect.height) return;

        const relativeX = clamp((event.clientX - rect.left) / rect.width, 0, 1);
        const relativeY = clamp((event.clientY - rect.top) / rect.height, 0, 1);
        const rotateY = (relativeX - 0.5) * 7;
        const rotateX = (0.5 - relativeY) * 7;

        card.style.setProperty('--spot-x', `${(relativeX * 100).toFixed(1)}%`);
        card.style.setProperty('--spot-y', `${(relativeY * 100).toFixed(1)}%`);
        card.style.transform = `perspective(1050px) translate3d(0, -5px, 0) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;

        if (image) {
          const shiftX = (0.5 - relativeX) * 8;
          const shiftY = (0.5 - relativeY) * 7;
          image.style.transform = `scale(1.055) translate3d(${shiftX.toFixed(2)}px, ${shiftY.toFixed(2)}px, 0)`;
        }
      }, { passive: true });

      card.addEventListener('pointerleave', () => {
        card.classList.remove('is-pointer-active');
        card.style.removeProperty('--spot-x');
        card.style.removeProperty('--spot-y');
        card.style.removeProperty('transform');
        image?.style.removeProperty('transform');
      });
    });

    document.querySelectorAll('.button, .icon-button, .gallery-back').forEach((control) => {
      control.classList.add('pointer-magnetic');

      control.addEventListener('pointermove', (event) => {
        const rect = control.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width - 0.5) * 9;
        const y = ((event.clientY - rect.top) / rect.height - 0.5) * 7;
        control.style.translate = `${x.toFixed(2)}px ${y.toFixed(2)}px`;
      }, { passive: true });

      control.addEventListener('pointerleave', () => {
        control.style.removeProperty('translate');
      });
    });
  }
'''

          if js_marker not in js:
              closing = js.rfind('\n})();')
              if closing == -1:
                  raise SystemExit('Could not locate the script closure')
              js = js[:closing] + js_block + js[closing:]
              js_path.write_text(js, encoding='utf-8')

          for html_path in Path('.').rglob('*.html'):
              text = html_path.read_text(encoding='utf-8')
              text = text.replace('style.css?v=20', 'style.css?v=21')
              text = text.replace('script.js?v=20', 'script.js?v=21')
              html_path.write_text(text, encoding='utf-8')
          PY

          node --check script.js
          grep -q "Pointer interaction layer v21" style.css
          grep -q "Pointer interaction layer v21" script.js

          rm -rf .cursor-interactions
          rm -f .github/workflows/apply-cursor-interactions.yml

      - name: Commit interaction upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cursor-following portfolio interactions"
          git push origin HEAD:cursor-interactions
