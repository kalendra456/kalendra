name: Apply cursor interactions

on:
  push:
    branches: ["cursor-interactions"]
    paths:
      - ".cursor-interactions/READY"

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out interaction branch
        uses: actions/checkout@v4
        with:
          ref: cursor-interactions
          fetch-depth: 0

      - name: Add pointer-following interaction layer
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('style.css')
          css = css_path.read_text(encoding='utf-8')
          css_marker = '/* Pointer interaction layer v21 */'
          if css_marker not in css:
              css = css.rstrip() + '\n' + Path('.cursor-interactions/pointer.css').read_text(encoding='utf-8') + '\n'
              css_path.write_text(css, encoding='utf-8')

          js_path = Path('script.js')
          js = js_path.read_text(encoding='utf-8')
          js_marker = '  // Pointer interaction layer v21'
          if js_marker not in js:
              closing = js.rfind('\n})();')
              if closing == -1:
                  raise SystemExit('Could not locate the script closure')
              addition = Path('.cursor-interactions/pointer.js').read_text(encoding='utf-8')
              js = js[:closing] + addition + js[closing:]
              js_path.write_text(js, encoding='utf-8')

          for html_path in Path('.').rglob('*.html'):
              text = html_path.read_text(encoding='utf-8')
              text = text.replace('style.css?v=20', 'style.css?v=21')
              text = text.replace('script.js?v=20', 'script.js?v=21')
              html_path.write_text(text, encoding='utf-8')
          PY

          node --check script.js
          grep -q "Pointer interaction layer v21" style.css
          grep -q "Pointer interaction layer v21" script.js

          rm -rf .cursor-interactions
          rm -f .github/workflows/apply-cursor-interactions.yml

      - name: Commit interaction upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cursor-following portfolio interactions"
          git push origin HEAD:cursor-interactions
