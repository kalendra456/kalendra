name: Refine recruiter polish CSS

on:
  push:
    branches: ["recruiter-functional-polish"]
    paths:
      - ".recruiter-polish/REFINE_CSS"

permissions:
  contents: write

jobs:
  refine-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: recruiter-functional-polish
          fetch-depth: 0

      - name: Preserve existing proof animation and refine modal loading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('polish.css')
          text = path.read_text(encoding='utf-8')

          old = '''.proof-card[data-lightbox]::before {
            position: absolute;
            z-index: 3;
            top: .8rem;
            right: .8rem;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 999px;
            background: rgba(3, 10, 18, .72);
            color: #fff;
            padding: .34rem .52rem;
            font-family: var(--font-mono);
            font-size: .58rem;
            font-weight: 800;
            letter-spacing: .04em;
            content: "View proof";
            opacity: .78;
            backdrop-filter: blur(10px);
            transition: opacity var(--transition), transform var(--transition);
          }

          .proof-card[data-lightbox]:hover::before,
          .proof-card[data-lightbox]:focus-visible::before {
            transform: translateY(-2px);
            opacity: 1;
          }'''.replace('          ', '')

          new = '''.proof-card[data-lightbox] > span::after {
            display: inline-flex;
            width: fit-content;
            margin-top: .48rem;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 999px;
            background: rgba(3, 10, 18, .72);
            color: #fff;
            padding: .32rem .5rem;
            font-family: var(--font-mono);
            font-size: .57rem;
            font-weight: 800;
            letter-spacing: .04em;
            content: "View proof";
            opacity: .78;
            backdrop-filter: blur(10px);
            transition: opacity var(--transition), transform var(--transition);
          }

          .proof-card[data-lightbox]:hover > span::after,
          .proof-card[data-lightbox]:focus-visible > span::after {
            transform: translateY(-2px);
            opacity: 1;
          }'''.replace('          ', '')

          if old not in text:
            raise SystemExit('Expected proof affordance block was not found')
          text = text.replace(old, new, 1)

          loading = '''

          .proof-lightbox-image {
            transition: opacity 160ms var(--ease);
          }

          .proof-lightbox-image.is-loading {
            opacity: .38;
          }
          '''.replace('          ', '')

          marker = '''.proof-lightbox-caption {
            display: grid;'''
          if marker not in text:
            raise SystemExit('Lightbox caption marker was not found')
          text = text.replace(marker, loading + '\n' + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -rf .recruiter-polish
          rm -f .github/workflows/refine-polish-css.yml

      - name: Commit refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine proof lightbox polish"
          git push origin HEAD:recruiter-functional-polish
