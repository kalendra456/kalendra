name: Apply high-resolution government proof

on:
  push:
    branches: ["hires-government-proof"]
    paths:
      - ".hires-proof/READY"

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: hires-government-proof
          fetch-depth: 0

      - name: Install image support
        run: python3 -m pip install --quiet pillow

      - name: Restore full-resolution anonymized image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from PIL import Image, ImageDraw, ImageFont
          import base64
          import hashlib

          commit = 'e5cd6eebde51eeb40d4fba29c7b78148c662dd60'
          base = f'https://raw.githubusercontent.com/kalendra456/kalendra/{commit}/.private-program-update-v2'
          encoded_parts = []
          for index in range(9):
              url = f'{base}/part-{index:02d}'
              with urlopen(url, timeout=60) as response:
                  encoded_parts.append(response.read().decode('ascii'))

          image_bytes = base64.b85decode(''.join(encoded_parts))
          digest = hashlib.sha256(image_bytes).hexdigest()
          expected = 'c59c064ef7ddc56597dfef32d65327be7150effcbdd9b6254eba1b78032bedc6'
          if digest != expected:
              raise SystemExit(f'Unexpected source image SHA-256: {digest}')

          temporary = Path('/tmp/high-resolution-source.png')
          temporary.write_bytes(image_bytes)
          image = Image.open(temporary).convert('RGB')
          if image.size != (1746, 901):
              raise SystemExit(f'Unexpected source dimensions: {image.size}')

          # Keep the original full-resolution pixels and add only a clear
          # disclosure label so the anonymized public copy is not mistaken
          # for an untouched platform screenshot.
          draw = ImageDraw.Draw(image, 'RGBA')
          font_dir = Path('/usr/share/fonts/truetype/dejavu')
          title_font = ImageFont.truetype(str(font_dir / 'DejaVuSans-Bold.ttf'), 15)
          detail_font = ImageFont.truetype(str(font_dir / 'DejaVuSans.ttf'), 12)
          box = (1060, 118, 1692, 174)
          draw.rounded_rectangle(box, radius=10, fill=(5, 18, 29, 238), outline=(49, 190, 188, 220), width=2)
          draw.text((1078, 128), 'ANONYMIZED PUBLIC COPY', font=title_font, fill=(103, 228, 221, 255))
          draw.text(
              (1078, 151),
              'Organization and engagement identifiers were replaced for confidentiality.',
              font=detail_font,
              fill=(207, 222, 230, 245),
          )

          destination = Path('photo-gallery/images/swiss-bugbounty-findings-list.png')
          destination.parent.mkdir(parents=True, exist_ok=True)
          image.save(destination, format='PNG', optimize=True, compress_level=6)
          if Image.open(destination).size != (1746, 901):
              raise SystemExit('Saved image dimensions changed unexpectedly')

          page = Path('photo-gallery/index.html')
          text = page.read_text(encoding='utf-8')
          text = text.replace(
              'images/swiss-bugbounty-findings-list.png"',
              'images/swiss-bugbounty-findings-list.png?v=hires-redacted-20260901"',
          )
          text = text.replace(
              'Open Government Private Program high-impact findings proof',
              'Open high-resolution anonymized Government Private Program findings proof',
          )
          text = text.replace(
              'Government Private Program high-impact findings summary',
              'Government Private Program anonymized findings summary',
          )
          text = text.replace(
              '<span class="proof-type">Private / paid findings</span>\n              <h3>Government Private Program · High-impact findings</h3>\n              <p>Selected program outcome showing critical and high-impact paid security research while sensitive report details remain private.</p>',
              '<span class="proof-type">Anonymized / paid findings</span>\n              <h3>Government Private Program · Anonymized findings</h3>\n              <p>High-resolution anonymized public copy. Organization and engagement identifiers are replaced for confidentiality; finding outcomes and amounts remain visible.</p>',
          )
          text = text.replace(
              '<div class="gallery-card-body"><span class="proof-type">Private / paid findings</span><h3>Government Private Program · High-impact findings</h3><p>Selected paid-program outcome showing critical and high-impact research.</p></div>',
              '<div class="gallery-card-body"><span class="proof-type">Anonymized / paid findings</span><h3>Government Private Program · Anonymized findings</h3><p>High-resolution anonymized public copy with organization and engagement identifiers replaced for confidentiality.</p></div>',
          )
          page.write_text(text, encoding='utf-8')
          PY

          rm -rf .hires-proof
          rm -f .github/workflows/apply-hires-government-proof.yml

      - name: Commit high-resolution replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace government proof with high-resolution copy"
          git push origin HEAD:hires-government-proof
