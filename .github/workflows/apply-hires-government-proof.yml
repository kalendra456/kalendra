name: Apply high-resolution government proof

on:
  push:
    branches: ["hires-government-proof"]
    paths:
      - ".hires-final-payload/READY"

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: hires-government-proof
          fetch-depth: 0

      - name: Restore high-resolution anonymized image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import struct

          payload = Path('.hires-final-payload')
          parts = sorted(payload.glob('part-*'))
          if not parts:
              raise SystemExit('No high-resolution image payload found')

          encoded = ''.join(part.read_text(encoding='ascii') for part in parts)
          image_bytes = base64.b85decode(encoded)
          expected_sha256 = '86e35b395601624ca0fae8b3978c93d10b2b7e03f16350302679adcda812fd5b'
          digest = hashlib.sha256(image_bytes).hexdigest()
          if digest != expected_sha256:
              raise SystemExit(f'Unexpected image SHA-256: {digest}')

          if image_bytes[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Decoded payload is not a PNG')
          width, height = struct.unpack('>II', image_bytes[16:24])
          if (width, height) != (1746, 901):
              raise SystemExit(f'Unexpected image dimensions: {(width, height)}')

          destination = Path('photo-gallery/images/swiss-bugbounty-findings-list.png')
          destination.write_bytes(image_bytes)

          page = Path('photo-gallery/index.html')
          text = page.read_text(encoding='utf-8')
          text = text.replace(
              'images/swiss-bugbounty-findings-list.png?v=private-redacted-2026"',
              'images/swiss-bugbounty-findings-list.png?v=hires-redacted-20260901"',
          )
          text = text.replace(
              'images/swiss-bugbounty-findings-list.png"',
              'images/swiss-bugbounty-findings-list.png?v=hires-redacted-20260901"',
          )
          text = text.replace(
              'Open Government Private Program high-impact findings proof',
              'Open high-resolution anonymized Government Private Program findings proof',
          )
          text = text.replace(
              'Government Private Program high-impact findings summary',
              'Government Private Program anonymized findings summary',
          )
          text = text.replace(
              '<span class="proof-type">Private / paid findings</span>\n              <h3>Government Private Program · High-impact findings</h3>\n              <p>Selected program outcome showing critical and high-impact paid security research while sensitive report details remain private.</p>',
              '<span class="proof-type">Anonymized / paid findings</span>\n              <h3>Government Private Program · Anonymized findings</h3>\n              <p>High-resolution anonymized public copy. Organization and engagement identifiers are replaced for confidentiality; finding outcomes and amounts remain visible.</p>',
          )
          text = text.replace(
              '<div class="gallery-card-body"><span class="proof-type">Private / paid findings</span><h3>Government Private Program · High-impact findings</h3><p>Selected paid-program outcome showing critical and high-impact research.</p></div>',
              '<div class="gallery-card-body"><span class="proof-type">Anonymized / paid findings</span><h3>Government Private Program · Anonymized findings</h3><p>High-resolution anonymized public copy with organization and engagement identifiers replaced for confidentiality.</p></div>',
          )
          page.write_text(text, encoding='utf-8')
          PY

          rm -rf .hires-proof .hires-proof-payload .hires-final-payload
          rm -f .github/workflows/apply-hires-government-proof.yml

      - name: Commit high-resolution replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace government proof with high-resolution image"
          git push origin HEAD:hires-government-proof
