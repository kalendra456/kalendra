name: Apply complex logic and protocol security positioning v2

on:
  push:
    branches: ["complex-logic-protocol-security"]
    paths:
      - ".protocol-positioning/READY_V2"

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: complex-logic-protocol-security
          fetch-depth: 0

      - name: Execute corrected transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/apply-complex-logic-protocol-security.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)

          # The public gallery already contains an older, resolved Tools for Humanity
          # proof card. Only active-report identifiers and technical details must be
          # excluded from this new capability update.
          script = script.replace("    'Tools for Humanity',\n", "", 1)
          exec(compile(script, '/tmp/apply-protocol-positioning.py', 'exec'), {})
          PY

          rm -rf .protocol-positioning
          rm -f .github/workflows/apply-complex-logic-protocol-security.yml
          rm -f .github/workflows/apply-complex-logic-protocol-security-v2.yml

      - name: Commit portfolio refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complex logic and protocol security track"
          git push origin HEAD:complex-logic-protocol-security
