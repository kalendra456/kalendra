name: Preview balanced typography v2

on:
  push:
    branches: ["balanced-typography-scale"]
    paths:
      - ".typography-preview/READY_V2"

permissions:
  contents: write

jobs:
  render-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out typography branch
        uses: actions/checkout@v4
        with:
          ref: balanced-typography-scale
          fetch-depth: 0

      - name: Prepare deterministic visual preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          preview = '''
          <script>try { localStorage.setItem('portfolio-theme', 'dark'); } catch (_) {}</script>
          <style>
            [data-reveal],
            .hero-copy > *,
            .hero-visual .console-heading,
            .hero-visual .profile-row,
            .hero-visual .signal-panel,
            .hero-visual .console-footer {
              opacity: 1 !important;
              transform: none !important;
              filter: none !important;
              animation: none !important;
            }
          </style>
          '''
          if '</head>' not in text:
              raise SystemExit('Missing closing head element')
          path.write_text(text.replace('</head>', preview + '\n</head>', 1), encoding='utf-8')
          PY

      - name: Render desktop and mobile previews
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No headless Chrome-compatible browser found on runner" >&2
            exit 1
          fi

          mkdir -p typography-preview-v2
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/typography-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep .25
          done

          COMMON_FLAGS=(
            --headless
            --disable-gpu
            --no-sandbox
            --hide-scrollbars
            --disable-background-timer-throttling
            --run-all-compositor-stages-before-draw
            --virtual-time-budget=5000
            --force-device-scale-factor=1
          )

          "$CHROME_BIN" "${COMMON_FLAGS[@]}" --window-size=1440,2200 \
            --screenshot=typography-preview-v2/desktop.png \
            http://127.0.0.1:8080/

          "$CHROME_BIN" "${COMMON_FLAGS[@]}" --window-size=390,1800 \
            --screenshot=typography-preview-v2/mobile.png \
            http://127.0.0.1:8080/

          test -s typography-preview-v2/desktop.png
          test -s typography-preview-v2/mobile.png

      - name: Upload visual previews
        uses: actions/upload-artifact@v4
        with:
          name: balanced-typography-preview-v2
          path: typography-preview-v2/*.png
          if-no-files-found: error
          retention-days: 2

      - name: Clean temporary preview files
        shell: bash
        run: |
          git restore index.html
          rm -rf .typography-preview
          rm -f .github/workflows/preview-typography-v2.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete typography visual preview v2"
          git push origin HEAD:balanced-typography-scale
