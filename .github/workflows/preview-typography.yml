name: Preview balanced typography

on:
  push:
    branches: ["balanced-typography-scale"]
    paths:
      - ".typography-preview/READY"

permissions:
  contents: write

jobs:
  render-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out typography branch
        uses: actions/checkout@v4
        with:
          ref: balanced-typography-scale
          fetch-depth: 0

      - name: Render desktop and mobile previews
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No headless Chrome-compatible browser found on runner" >&2
            exit 1
          fi

          mkdir -p typography-preview
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/typography-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null

          "$CHROME_BIN" --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --force-device-scale-factor=1 --window-size=1440,2200 \
            --screenshot=typography-preview/desktop.png \
            http://127.0.0.1:8080/

          "$CHROME_BIN" --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --force-device-scale-factor=1 --window-size=390,1800 \
            --screenshot=typography-preview/mobile.png \
            http://127.0.0.1:8080/

          test -s typography-preview/desktop.png
          test -s typography-preview/mobile.png

      - name: Upload visual previews
        uses: actions/upload-artifact@v4
        with:
          name: balanced-typography-preview
          path: typography-preview/*.png
          if-no-files-found: error
          retention-days: 2

      - name: Remove temporary preview workflow
        shell: bash
        run: |
          rm -rf .typography-preview
          rm -f .github/workflows/preview-typography.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete typography visual preview"
          git push origin HEAD:balanced-typography-scale
